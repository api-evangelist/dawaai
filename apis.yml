aid: dawaai
name: Dawaai
description: >-
  Dawaai is Pakistan's leading digital healthcare platform, operating a licensed
  online pharmacy alongside telehealth and diagnostic services. Founded on a
  licensed retail pharmacy (License #1265, 2014) and headquartered in Karachi,
  Dawaai lets patients order authentic prescription and OTC medicines for
  temperature-controlled doorstep delivery, book doctor and mental-health
  consultations, order home-based lab tests and checkups, arrange home nursing
  and medical services, and subscribe to chronic-care programs for diabetes and
  obesity. It is a LegitScript-certified healthcare merchant that sources
  directly from manufacturers and distributors, with qualified pharmacists
  handling procurement, storage, and dispensing. Dawaai is backed by 500 Global
  and operates across Pakistan, including Karachi and Rawalpindi. This profile
  was added to the API Evangelist network via the venture portfolio pipeline;
  Dawaai publishes no public developer/API program at this time.
